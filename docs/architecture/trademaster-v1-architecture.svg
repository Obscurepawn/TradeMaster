<svg xmlns="http://www.w3.org/2000/svg" width="600" height="866" viewBox="0 0 600 866" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">One session in the event runner</title>
  <desc id="desc">At an eligible open the event strategy sizes target weights using opening marks. Sell orders precede buys. Order validation and matching produce outcomes, the lot ledger posts fills and fees, and closing marks supply the daily account valuation.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #19333c; }
      .title { font-size: 30px; font-weight: 700; }
      .intro { font-size: 19px; fill: #405864; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: 0.4px; }
      .name { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .edge { fill: none; stroke: #486c75; stroke-width: 2.4; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9 2.5 4.5Z" fill="#486c75"/>
    </marker>
  </defs>
  <rect width="600" height="866" fill="#fbfcfa"/>
    <text x="26" y="43" class="title">One session in the event runner</text>
    <text x="27" y="74" class="intro">A saved signal sets the earliest time it can trade.</text>
  <g id="settlement">
    <rect x="28" y="96" width="544" height="94" rx="10" fill="#ecf5ef" stroke="#a2b9a9" stroke-width="1.4"/>
    <text x="44" y="125" class="label">T+1 SETTLEMENT</text>
    <text x="44" y="155" class="name">Release eligible lots</text>
    <text x="44" y="182" class="body">The lot ledger updates the shares available to sell.</text>
  </g>
  <g id="after-settlement">
    <path d="M297 190 V220" class="edge"/>
  </g>
  <g id="open">
    <rect x="28" y="222" width="544" height="118" rx="10" fill="#ecf3f8" stroke="#adbfcb" stroke-width="1.4"/>
    <text x="44" y="251" class="label">OPEN  ·  STRATEGY</text>
    <text x="44" y="281" class="name">Translate due signals into orders</text>
    <text x="44" y="308" class="body">The scheduled strategy sizes weights at the open.</text>
    <text x="44" y="332" class="body">It sorts sales before buys, then sorts by instrument.</text>
  </g>
  <g id="after-open">
    <path d="M297 340 V370" class="edge"/>
  </g>
  <g id="rule-checks">
    <rect x="28" y="372" width="544" height="118" rx="10" fill="#ecf5ef" stroke="#a2b9a9" stroke-width="1.4"/>
    <text x="44" y="401" class="label">OPEN  ·  VALIDATION AND MATCHING</text>
    <text x="44" y="431" class="name">Check orders against the opening bar</text>
    <text x="44" y="458" class="body">Status, price limits, lots, cash and sellable shares</text>
    <text x="44" y="482" class="body">determine the order outcome. Accepted orders can fill.</text>
  </g>
  <g id="after-rule-checks">
    <path d="M297 490 V520" class="edge"/>
  </g>
  <g id="posting">
    <rect x="28" y="522" width="544" height="118" rx="10" fill="#ecf5ef" stroke="#a2b9a9" stroke-width="1.4"/>
    <text x="44" y="551" class="label">EXECUTION  ·  LEDGER</text>
    <text x="44" y="581" class="name">Post fills and costs</text>
    <text x="44" y="608" class="body">The ledger updates cash, positions and lots. Sales can</text>
    <text x="44" y="632" class="body">fund purchases made later at the same open.</text>
  </g>
  <g id="after-posting">
    <path d="M297 640 V670" class="edge"/>
  </g>
  <g id="mark">
    <rect x="28" y="672" width="544" height="118" rx="10" fill="#fff" stroke="#bbcbce" stroke-width="1.4"/>
    <text x="44" y="701" class="label">CLOSE  ·  ACCOUNT</text>
    <text x="44" y="731" class="name">Mark the holdings at closing prices</text>
    <text x="44" y="758" class="body">Cash plus holdings gives net asset value. The saved</text>
    <text x="44" y="782" class="body">results supply the performance series and report.</text>
  </g>
    <text x="28" y="835" class="intro">The next session starts from the actual cash and lots.</text>
</svg>
