<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">TradeMaster 系统架构</title>
  <desc id="desc">Tushare数据经Python数据与研究层进入Rust事件回测内核，最终产生不可变运行记录和可视化报告。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", "DejaVu Sans", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 17px; fill: #475569; }
      .group { font-size: 19px; font-weight: 700; fill: #1e293b; }
      .node-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .node-sub { font-size: 14px; fill: #475569; }
      .edge { font-size: 13px; font-weight: 600; fill: #334155; }
      .footer { font-size: 14px; fill: #475569; }
    </style>
  </defs>

  <rect width="1400" height="780" fill="#f8fafc"/>
  <text x="48" y="54" class="title">TradeMaster 系统架构</text>
  <text x="48" y="86" class="subtitle">Python负责数据、PIT研究、因子与信号；Rust负责权威事件循环、交易约束和账本</text>

  <rect x="30" y="130" width="210" height="520" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="320" y="130" width="420" height="520" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <rect x="820" y="130" width="250" height="520" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="1150" y="130" width="220" height="520" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>

  <text x="52" y="166" class="group">外部与入口</text>
  <text x="342" y="166" class="group">Python 数据与研究层</text>
  <text x="842" y="166" class="group">Rust 回测内核</text>
  <text x="1172" y="166" class="group">不可变输出</text>

  <!-- Connections are deliberately behind nodes. -->
  <path d="M210 286 H280 V240 H360" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M210 500 H280 V410 H360" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow-slate)"/>
  <path d="M530 295 V355" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M530 465 V515" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M700 410 H780 V275 H855" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M945 335 V440" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1035 500 H1110 V297 H1180" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M700 560 V610 H1260 V595" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1260 360 V470" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-slate)"/>

  <rect x="235" y="218" width="112" height="27" rx="8" fill="#ffffff"/>
  <text x="247" y="237" class="edge">Tushare API</text>
  <rect x="712" y="376" width="103" height="27" rx="8" fill="#ffffff"/>
  <text x="724" y="395" class="edge">SignalRecord</text>
  <rect x="1038" y="360" width="103" height="27" rx="8" fill="#ffffff"/>
  <text x="1050" y="379" class="edge">Run records</text>

  <rect x="60" y="225" width="150" height="122" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="92" cy="258" r="17" fill="#dbeafe"/>
  <path d="M84 258 H100 M92 250 V266" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="263" class="node-title">Tushare</text>
  <text x="78" y="298" class="node-sub">当前唯一外部数据源</text>
  <text x="78" y="322" class="node-sub">行情、状态、财务、指数</text>

  <rect x="60" y="445" width="150" height="110" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="82" y="480" class="node-title">用户 / CLI</text>
  <text x="82" y="510" class="node-sub">配置、因子、策略</text>
  <text x="82" y="534" class="node-sub">运行与报告请求</text>

  <rect x="360" y="185" width="340" height="110" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="384" y="220" class="node-title">Data Foundation / Research Store</text>
  <text x="384" y="250" class="node-sub">Cache-first、Parquet权威、DuckDB目录</text>
  <text x="384" y="274" class="node-sub">request hash、coverage、PIT snapshot</text>

  <rect x="360" y="355" width="340" height="110" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="384" y="390" class="node-title">Factor Manager / Strategy</text>
  <text x="384" y="420" class="node-sub">definition与DAG、向量化因子/信号</text>
  <text x="384" y="444" class="node-sub">只生成交易意图，不直接修改账户</text>

  <rect x="360" y="515" width="340" height="90" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="384" y="550" class="node-title">Factor Evaluation / Reporting</text>
  <text x="384" y="580" class="node-sub">IC、RankIC、暴露、容量、HTML报告</text>

  <rect x="855" y="215" width="180" height="120" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="879" y="252" class="node-title">tm-runner</text>
  <text x="879" y="282" class="node-sub">EventRuntime / Clock</text>
  <text x="879" y="306" class="node-sub">开盘、收盘、日结</text>

  <rect x="855" y="440" width="180" height="130" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="879" y="477" class="node-title">Rules / Execution</text>
  <text x="879" y="507" class="node-sub">T+1、停牌、涨跌停</text>
  <text x="879" y="531" class="node-sub">100股整手、费用、滑点</text>
  <text x="879" y="555" class="node-sub">原子Ledger与NAV</text>

  <rect x="1180" y="235" width="160" height="125" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="1202" y="272" class="node-title">Run Bundle</text>
  <text x="1202" y="302" class="node-sub">Order / Fill</text>
  <text x="1202" y="326" class="node-sub">Ledger / NAV</text>
  <text x="1202" y="350" class="node-sub">hash / lineage</text>

  <rect x="1180" y="470" width="160" height="125" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="1202" y="507" class="node-title">Reports</text>
  <text x="1202" y="537" class="node-sub">HTML / Markdown</text>
  <text x="1202" y="561" class="node-sub">JSON / Parquet</text>
  <text x="1202" y="585" class="node-sub">metrics</text>

  <rect x="45" y="690" width="1310" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="70" y="718" class="footer">边界：Python不拥有权威账户；Rust不访问Tushare或DuckDB；报告只能读取已验证的不可变输入与运行记录。</text>
  <text x="70" y="740" class="footer">扩展：Calendar、MarketRules、Settlement、FeeSchedule和Currency可按市场注入；当前正式数据接入仅实现Tushare。</text>
</svg>
