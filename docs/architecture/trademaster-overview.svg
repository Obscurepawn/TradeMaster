<svg xmlns="http://www.w3.org/2000/svg" width="600" height="728" viewBox="0 0 600 728" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Saved-event workflow</title>
  <desc id="desc">TuShare observations and factor values provide inputs for dated strategy signals. Python supplies those signals and market events to the native Rust engine. Rust returns fills and account history. The event bundle links the request and result to the evidence used by its report.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #19333c; }
      .title { font-size: 30px; font-weight: 700; }
      .intro { font-size: 19px; fill: #405864; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: 0.4px; }
      .name { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .edge { fill: none; stroke: #486c75; stroke-width: 2.4; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9 2.5 4.5Z" fill="#486c75"/>
    </marker>
  </defs>
  <rect width="600" height="728" fill="#fbfcfa"/>
    <text x="26" y="43" class="title">Saved-event workflow</text>
    <text x="27" y="74" class="intro">From historical observations to an event-runner report.</text>
  <g id="research">
    <rect x="28" y="96" width="544" height="118" rx="10" fill="#f8f2e7" stroke="#c8b69b" stroke-width="1.4"/>
    <text x="44" y="125" class="label">01  ·  PYTHON</text>
    <text x="44" y="155" class="name">Prepare the research inputs</text>
    <text x="44" y="182" class="body">TuShare supplies prices, trading status and financials.</text>
    <text x="44" y="206" class="body">Parquet stores observations. DuckDB indexes coverage.</text>
  </g>
  <g id="research-to-decision">
    <path d="M297 214 V242" class="edge"/>
  </g>
  <g id="selection">
    <rect x="28" y="244" width="544" height="118" rx="10" fill="#ecf3f8" stroke="#adbfcb" stroke-width="1.4"/>
    <text x="44" y="273" class="label">02  ·  PYTHON</text>
    <text x="44" y="303" class="name">Select the portfolio</text>
    <text x="44" y="330" class="body">Compute factors from data published by decision time.</text>
    <text x="44" y="354" class="body">The strategy emits dated weight or share targets.</text>
  </g>
  <g id="decisions-to-runner">
    <path d="M297 362 V390" class="edge"/>
  </g>
  <g id="runner">
    <rect x="28" y="392" width="544" height="118" rx="10" fill="#ecf5ef" stroke="#a2b9a9" stroke-width="1.4"/>
    <text x="44" y="421" class="label">03  ·  RUST</text>
    <text x="44" y="451" class="name">Replay events and signals</text>
    <text x="44" y="478" class="body">Rust reads the saved events and targets.</text>
    <text x="44" y="502" class="body">The event loop checks orders and posts fills and fees.</text>
  </g>
  <g id="runner-to-bundle">
    <path d="M297 510 V538" class="edge"/>
  </g>
  <g id="outputs">
    <rect x="28" y="540" width="544" height="148" rx="10" fill="#fff" stroke="#bbcbce" stroke-width="1.4"/>
    <text x="44" y="569" class="label">04  ·  PYTHON</text>
    <text x="44" y="599" class="name">Save the bundle and report</text>
    <text x="44" y="626" class="body">The bundle identifies its inputs, Rust request and result.</text>
    <text x="44" y="650" class="body">The HTML report shows equity, costs and the benchmark.</text>
    <text x="44" y="674" class="body">The verifier replays the request and rebuilds the report.</text>
  </g>
</svg>
