<svg xmlns="http://www.w3.org/2000/svg" width="610" height="878" viewBox="0 0 610 878" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">How research data reaches a strategy or a factor evaluation</title>
  <desc id="desc">Research data has two uses. Published observations produce factor values for selection. Future prices produce forward-return labels. The evaluator joins factor values to labels. The saved-event strategy receives dated factor values and the runner consumes market events and signals.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #19333c; }
      .title { font-size: 30px; font-weight: 700; }
      .intro { font-size: 19px; fill: #405864; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: 0.4px; }
      .name { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .edge { fill: none; stroke: #486c75; stroke-width: 2.4; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9 2.5 4.5Z" fill="#486c75"/>
    </marker>
  </defs>
  <rect width="610" height="878" fill="#fbfcfa"/>
    <text x="26" y="43" class="title">Factor research and trading data</text>
    <text x="27" y="74" class="intro">Use observed prices for scoring and later prices for labels.</text>
  <g id="inputs">
    <rect x="26" y="96" width="558" height="124" rx="10" fill="#f8f2e7" stroke="#c8b69b" stroke-width="1.4"/>
    <text x="42" y="125" class="label">TUSHARE  ·  LOCAL DATA</text>
    <text x="42" y="156" class="name">Acquire and index source observations</text>
    <text x="42" y="183" class="body">Store prices, status, financials and calendars in Parquet.</text>
    <text x="42" y="207" class="body">DuckDB indexes requests, coverage and object hashes.</text>
  </g>
  <g id="branches">
    <path d="M153 220 V260" class="edge"/>
    <path d="M459 220 V260" class="edge"/>
  </g>
  <g id="factor-inputs">
    <rect x="22" y="262" width="272" height="122" rx="10" fill="#ecf3f8" stroke="#adbfcb" stroke-width="1.4"/>
    <text x="38" y="289" class="label">AT DECISION TIME</text>
    <text x="38" y="320" class="name">Factor inputs</text>
    <text x="38" y="347" class="body">Use available prices and</text>
    <text x="38" y="371" class="body">published fundamentals.</text>
  </g>
  <g id="label-inputs">
    <rect x="316" y="262" width="272" height="122" rx="10" fill="#f8f2e7" stroke="#c8b69b" stroke-width="1.4"/>
    <text x="332" y="289" class="label">AFTER THE DECISION</text>
    <text x="332" y="320" class="name">Label inputs</text>
    <text x="332" y="347" class="body">Use later prices and the</text>
    <text x="332" y="371" class="body">specified holding horizon.</text>
  </g>
  <g id="dates-to-values">
    <path d="M153 384 V420" class="edge"/>
    <path d="M459 384 V420" class="edge"/>
  </g>
  <g id="factor-values">
    <rect x="22" y="422" width="272" height="116" rx="10" fill="#ecf3f8" stroke="#adbfcb" stroke-width="1.4"/>
    <text x="38" y="457" class="name">Factor values</text>
    <text x="38" y="491" class="body">Store scores by date,</text>
    <text x="38" y="516" class="body">instrument and definition.</text>
  </g>
  <g id="forward-returns">
    <rect x="316" y="422" width="272" height="116" rx="10" fill="#f8f2e7" stroke="#c8b69b" stroke-width="1.4"/>
    <text x="332" y="457" class="name">Forward returns</text>
    <text x="332" y="491" class="body">Record eligible entries</text>
    <text x="332" y="516" class="body">and realized price moves.</text>
  </g>
  <g id="evaluation-join">
    <path d="M148 538 V603" class="edge"/>
    <path d="M459 538 V603" class="edge"/>
    <path d="M251 538 V568 H345 V603" class="edge"/>
  </g>
  <g id="strategy">
    <rect x="22" y="605" width="272" height="114" rx="10" fill="#ecf5ef" stroke="#a2b9a9" stroke-width="1.4"/>
    <text x="38" y="639" class="name">Strategy selection</text>
    <text x="38" y="671" class="body">Turn dated scores into</text>
    <text x="38" y="696" class="body">weight or share targets.</text>
  </g>
  <g id="diagnostics">
    <rect x="316" y="605" width="272" height="114" rx="10" fill="#fff" stroke="#bbcbce" stroke-width="1.4"/>
    <text x="332" y="639" class="name">Factor evaluation</text>
    <text x="332" y="671" class="body">Join scores to labels.</text>
    <text x="332" y="696" class="body">Compute IC and quantiles.</text>
  </g>
  <g id="outputs">
    <path d="M153 719 V748" class="edge"/>
    <path d="M459 719 V748" class="edge"/>
  </g>
  <g id="event-run">
    <rect x="22" y="750" width="272" height="100" rx="10" fill="#ecf5ef" stroke="#a2b9a9" stroke-width="1.4"/>
    <text x="38" y="784" class="name">Saved-event run</text>
    <text x="38" y="818" class="body">Replay targets and bars.</text>
  </g>
  <g id="factor-report">
    <rect x="316" y="750" width="272" height="100" rx="10" fill="#fff" stroke="#bbcbce" stroke-width="1.4"/>
    <text x="332" y="784" class="name">Research report</text>
    <text x="332" y="818" class="body">Publish factor diagnostics.</text>
  </g>
</svg>
