    .subtitle, .axis { fill: #425763; }
    .axis { font-size: 16px; font-variant-numeric: tabular-nums; }
    .eyebrow { font-size: 15px; font-weight: 650; letter-spacing: 1px; fill: #39515c; }
    .label { font-size: 17px; font-weight: 620; }
    .amount { font-size: 22px; font-weight: 680; font-variant-numeric: tabular-nums; }
  </style>
