<svg xmlns="http://www.w3.org/2000/svg" width="820" height="508" viewBox="0 0 820 508" role="img" aria-labelledby="title desc">
  <title id="title">Closing equity of three snapshot backtests</title>
  <desc id="desc">Each strategy starts with CNY 100,000 on January 2, 2024. The sample covers five A-share stocks and 98 trading sessions through May 31. Weekly momentum ends at CNY 104,322.15, moving average at CNY 107,115.45, and MACD at CNY 106,823.67. Each line connects observed session closes by calendar date. All three lines use the same CNY scale.</desc>
