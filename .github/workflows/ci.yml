name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  UV_PYTHON: "3.12"

jobs:
  check:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment and build native extension
        run: uv sync --locked --extra dev

      - name: Lint Python with Ruff
        run: uv run ruff check python tests

      - name: Type-check Python with mypy
        run: uv run mypy --strict python tests

      - name: Run Python test suite
        run: uv run pytest -q

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace with Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run Rust workspace tests
        run: cargo test --locked --workspace

      - name: Build Python wheel and source distribution
        run: uv build
