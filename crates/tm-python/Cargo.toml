[package]
name = "tm-python"
description = "PyO3 native extension binding the TradeMaster Rust execution engine into Python"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312"] }
pythonize = "0.29"
serde_json.workspace = true
tm-core.workspace = true
tm-engine.workspace = true
tm-runner = { path = "../tm-runner" }
