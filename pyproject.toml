[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trademaster"
version = "0.1.0"
description = "A-share research and event backtesting framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["a-share", "backtesting", "factor-research", "quant", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "duckdb>=1.3",
  "pyarrow>=20",
  "pydantic>=2.11",
  "plotly>=6",
  "tushare>=1.4",
]

[project.urls]
Homepage = "https://github.com/Obscurepawn/TradeMaster"
Repository = "https://github.com/Obscurepawn/TradeMaster.git"
Issues = "https://github.com/Obscurepawn/TradeMaster/issues"

[project.scripts]
tm-factor = "trademaster.factors.__main__:main"
tm-research-full-a = "trademaster.research.__main__:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "pyarrow-stubs>=20",
  "pytest>=8.4",
  "pytest-cov>=6",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["python/trademaster"]

[tool.hatch.build.targets.wheel.force-include]
"crates/tm-core/schemas" = "trademaster/schemas"

[tool.hatch.build.targets.sdist]
include = [
  "python/trademaster",
  "crates/tm-core/schemas",
  "LICENSE",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "python"
files = ["python/trademaster", "tests"]
