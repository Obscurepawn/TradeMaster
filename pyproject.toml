[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "trademaster"
version = "0.1.0"
description = "Reproducible quantitative research and Rust-powered portfolio backtesting framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["a-share", "backtesting", "factor-research", "point-in-time", "portfolio", "quant", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "duckdb>=1.3",
  "pyarrow>=20",
  "pydantic>=2.11",
  "plotly>=6",
  "tushare>=1.4",
]

[project.urls]
Homepage = "https://github.com/Obscurepawn/TradeMaster"
Repository = "https://github.com/Obscurepawn/TradeMaster.git"
Issues = "https://github.com/Obscurepawn/TradeMaster/issues"

[project.scripts]
tm-replay = "trademaster.replay:main"
tm-indexone = "trademaster.data.indexone:main"
tm-factor = "trademaster.factors.__main__:main"
tm-research-full-a = "trademaster.research.__main__:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "pyarrow-stubs>=20",
  "pytest>=8.4",
  "pytest-cov>=6",
  "ruff>=0.12",
]

[tool.maturin]
manifest-path = "crates/tm-python/Cargo.toml"
python-source = "python"
module-name = "trademaster._native"
locked = true
include = [
  { path = "schemas/*.json", from = "out-dir", to = "trademaster/" },
  { path = "docs/examples/round-trip.json", format = "sdist" },
]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/*/Cargo.toml" },
  { file = "crates/**/*.rs" },
  { file = "crates/tm-core/schemas/*.json" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "python"
files = ["python/trademaster", "tests"]
