[workspace]
resolver = "2"
members = [
  "crates/tm-core",
  "crates/tm-engine",
  "crates/tm-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Obscurepawn/TradeMaster"
rust-version = "1.97"

[workspace.dependencies]
arrow-array = "56.0"
arrow-schema = "56.0"
bytes = "1.10"
parquet = { version = "56.0", features = ["arrow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "serde-well-known", "parsing", "formatting"] }
tm-core = { version = "0.1.0", path = "crates/tm-core" }
tm-engine = { version = "0.1.0", path = "crates/tm-engine" }
